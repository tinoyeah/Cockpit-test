name: Aggiorna dati cockpit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  copilot-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Raccoglie le news
        run: python scripts/collect_news.py

      - name: Raccoglie cambi e prezzi
        run: python scripts/collect_market.py

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa Copilot CLI
        run: npm install -g @github/copilot

      - name: Genera summary.json con Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "$(cat <<'PROMPT'
          Leggi esclusivamente questi file del repository:
          - data/news.json
          - data/market.json

          Genera o sostituisci il file data/summary.json.

          Il file deve essere JSON valido e avere esattamente questa struttura:
          {
            "updated_at": "ISO 8601 UTC",
            "headline": "headline generale della giornata",
            "intro": "introduzione di 3-5 frasi",
            "sections": [
              {
                "title": "Aziende, vertici e M&A",
                "items": [
                  {
                    "title": "titolo",
                    "text": "cosa è successo e perché è importante",
                    "market": "mercato o area",
                    "link": "URL oppure stringa vuota"
                  }
                ]
              }
            ],
            "watchlist": ["elemento da monitorare"]
          }

          Le sezioni devono essere esattamente:
          1. Aziende, vertici e M&A
          2. Industria italiana e brand italiani
          3. Food, FMCG e retail
          4. Mercati e filiali internazionali
          5. Materie prime, energia e logistica
          6. Macro e regolamentazione
          7. Sport

          Usa esclusivamente le informazioni presenti nei due file.
          Non inventare dati, eventi, numeri o collegamenti causali.
          Puoi lasciare vuota una sezione se non ci sono informazioni rilevanti.
          Limita ogni sezione a un massimo di 5 elementi.
          Il briefing deve essere leggibile in circa 4-5 minuti.
          Inserisci il link originale quando disponibile.

          Dopo aver generato il file, verifica che sia JSON valido.
          Non modificare nessun altro file del repository.
          PROMPT
          )" --allow-tool=write --allow-tool='shell(cat:*)' --allow-tool='shell(date:*)' --no-ask-user

      - name: Verifica summary.json
        run: python -m json.tool data/summary.json > /dev/null

      - name: Pubblica news e sintesi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/market.json data/summary.json
          git diff --cached --quiet || git commit -m "Aggiorna dati cockpit"
          git push
