name: Aggiorna dati cockpit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  copilot-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Raccoglie le news
        run: python scripts/collect_news.py

      - name: Raccoglie cambi e prezzi
        run: python scripts/collect_market.py

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa Copilot CLI
        run: npm install -g @github/copilot

      - name: Genera summary.json con Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "$(cat <<'PROMPT'
          Sei il responsabile Group Business Controlling di un gruppo FMCG internazionale.

          Leggi direttamente e interpreta esclusivamente questi file del repository:
          - data/news.json
          - data/market.json

          I dati comprendono, quando disponibili:
          - aziende, vertici e operazioni M&A;
          - industria italiana e brand italiani;
          - food, FMCG e retail;
          - mercati internazionali e filiali;
          - materie prime, energia e logistica;
          - scenario macroeconomico e regolamentazione;
          - sport;
          - prezzi e cambi.

          Prepara una sola lettura manageriale complessiva della giornata.

          Non creare sezioni, capitoli, titoletti interni, elenchi puntati, numerazioni, liste di notizie o blocchi separati. Devi scrivere un unico discorso fluido e continuo, come se stessi facendo un briefing orale a un CFO o a un CEO.

          Il discorso deve:
          - riassumere tutto ciò che è rilevante nei dati;
          - individuare un filo rosso che colleghi gli eventi;
          - spiegare le dinamiche in corso;
          - mettere in relazione aziende, mercati, consumatori, costi, supply chain, energia e scenario macroeconomico;
          - spiegare perché ciò che sta accadendo è importante;
          - esprimere un punto di vista manageriale;
          - evidenziare le implicazioni più probabili per aziende e mercati;
          - indicare, all’interno del discorso, ciò che merita maggiore attenzione;
          - integrare anche le informazioni sportive solo se risultano presenti e rilevanti nei dati.

          Non limitarti a ripetere le singole notizie che l’utente troverà nelle altre pagine. Devi spiegare che cosa significano nel loro insieme e quale dinamica complessiva sembra emergere.

          Usa esclusivamente le informazioni presenti nei file.
          Non inventare fatti, numeri, eventi, fonti o relazioni causali.
          Non attribuire ai dati significati che non possono sostenere.
          Quando i dati non consentono una conclusione certa, utilizza formule prudenti come:
          "potrebbe indicare", "sembra emergere", "il quadro suggerisce" oppure "sarà importante monitorare".

          Il testo deve essere:
          - discorsivo;
          - autorevole;
          - naturale;
          - concreto;
          - leggibile in circa 4-5 minuti;
          - adatto a un manager o a un responsabile finanziario.

          Non usare titoletti, numerazioni o bullet point all’interno del discorso.
          Non trasformare il briefing in una lista di notizie.
          Non ripetere inutilmente lo stesso concetto.
          Dai priorità alle dinamiche più rilevanti e alle loro implicazioni manageriali.

          Restituisci esclusivamente JSON valido, senza markdown e senza blocchi di codice, con questa struttura:

          {
            "updated_at": "data e ora attuali in formato ISO 8601 UTC",
            "headline": "una frase breve che sintetizza la dinamica centrale della giornata",
            "intro": "un unico discorso completo e continuo di circa 4-5 minuti",
            "watchlist": [
              "eventuale elemento da monitorare"
            ]
          }

          Tutto il contenuto del briefing deve essere inserito nel campo "intro".
          Il campo "watchlist" deve contenere solo gli elementi realmente rilevanti da monitorare nel prossimo futuro.
          Se non ci sono elementi sufficientemente rilevanti, restituisci una lista vuota.

          Dopo aver generato il contenuto, scrivi obbligatoriamente il JSON nel file:
          data/summary.json

          Non modificare nessun altro file del repository.
          Verifica che data/summary.json sia un JSON valido prima di terminare.
          PROMPT
          )" --allow-tool=write --allow-tool='shell(cat:*)' --allow-tool='shell(date:*)' --no-ask-user

      - name: Verifica summary.json
        run: python -m json.tool data/summary.json > /dev/null

      - name: Pubblica news e sintesi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/market.json data/summary.json
          git diff --cached --quiet || git commit -m "Aggiorna dati cockpit"
          git push
