name: Aggiorna dati cockpit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  copilot-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Raccoglie le news
        run: python scripts/collect_news.py

      - name: Raccoglie le news delle filiali
        run: python scripts/collect_branches.py

      - name: Raccoglie cambi e prezzi
        run: python scripts/collect_market.py

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa Copilot CLI
        run: npm install -g @github/copilot

      - name: Genera summary.json con Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "$(cat <<'PROMPT'
          Sei il responsabile Group Business Controlling di un gruppo FMCG internazionale.

          Leggi direttamente e interpreta esclusivamente questi file del repository:
          - data/news.json
          - data/market.json

          I dati comprendono, quando disponibili:
          - aziende, competitor e settore food/FMCG;
          - retail, consumatori, prezzi, promozioni e private label;
          - materie prime, energia, logistica e supply chain;
          - scenario macroeconomico, cambi, dazi e regolamentazione;
          - prezzi e cambi presenti in data/market.json.

          Prepara una sola lettura manageriale complessiva della giornata.

          Prepara un briefing editoriale leggibile per un CFO o un CEO. Il testo deve avere una breve introduzione e 2 o 3 sottocapitoli narrativi. I sottocapitoli servono a rendere il testo leggibile, non a separare ogni singola notizia o ogni singolo argomento.

          Costruisci i sottocapitoli attorno alle dinamiche che emergono dai dati, non attorno alle categorie tecniche delle news. Per esempio, puoi usare una struttura simile a:
          1. La dinamica dominante della giornata;
          2. Come questa dinamica si riflette su aziende, mercati e condizioni operative;
          3. Cosa può cambiare nei prossimi giorni.

          Non devi usare necessariamente questi titoli: sceglili in base ai contenuti disponibili. Se le informazioni non giustificano tre blocchi, usane due.

          Il briefing deve:
          - partire dalla dinamica più importante, non dalla prima news dell'elenco;
          - individuare un filo rosso e svilupparlo in modo progressivo;
          - collegare le news solo quando il collegamento è sostenuto dai dati;
          - spiegare perché la dinamica è importante per un gruppo food/FMCG internazionale;
          - evidenziare le implicazioni su domanda, prezzi, margini, consumi, retail, costi, supply chain, cambi o rischi;
          - distinguere chiaramente fatti, interpretazioni e implicazioni manageriali;
          - citare una singola news solo se è necessaria per sostenere il ragionamento.

          Non limitarti a ripetere le singole notizie che l’utente troverà nelle altre pagine. Devi spiegare che cosa significano nel loro insieme e quale dinamica complessiva sembra emergere.
          Non creare una sezione per ogni news, azienda, mercato o tema.
          Non trasformare il briefing in un indice delle pagine dell'app.

          Usa esclusivamente le informazioni presenti nei file.
          Non inventare fatti, numeri, eventi, fonti o relazioni causali.
          Non attribuire ai dati significati che non possono sostenere.
          Quando i dati non consentono una conclusione certa, utilizza formule prudenti come:
          "potrebbe indicare", "sembra emergere", "il quadro suggerisce" oppure "sarà importante monitorare".

          Il testo deve essere:
          - discorsivo;
          - autorevole;
          - naturale;
          - concreto;
          - leggibile in circa 3 minuti;
          - adatto a un manager o a un responsabile finanziario.

          
          Non ripetere inutilmente lo stesso concetto.
          Dai priorità alle dinamiche più rilevanti e alle loro implicazioni manageriali.

          Restituisci esclusivamente JSON valido, senza markdown e senza blocchi di codice, con questa struttura:

          {
            "updated_at": "data e ora attuali in formato ISO 8601 UTC",
            "headline": "una frase breve che sintetizza la dinamica centrale della giornata",
            "intro": "un'introduzione breve, di 2-4 frasi, che anticipa la dinamica centrale",
            "sections": [
              {
                "title": "titolo narrativo del primo sottocapitolo",
                "items": [
                  {
                    "title": "eventualmente vuoto",
                    "text": "un testo discorsivo di 1-3 paragrafi che collega più informazioni, senza elencare le news",
                    "market": "eventualmente vuoto",
                    "link": "eventualmente vuoto"
                  }
                ]
              }
            ],
            "watchlist": [
              "eventuale elemento da monitorare"
            ]
          }

          Il campo "intro" deve essere solo un'apertura breve. Il contenuto principale deve essere inserito in 2 o 3 elementi dell'array "sections".
          Ogni sezione deve contenere un solo elemento in "items". Non creare più elementi per elencare le singole news.
          Il campo "text" deve essere discorsivo e può contenere più paragrafi separati da una riga vuota.
          I campi "title", "market" e "link" dentro ogni item possono essere stringhe vuote quando non servono. Non inserire link alle singole news salvo quando sono indispensabili.
          Il campo "watchlist" deve essere una bullet list e contenere solo gli elementi realmente rilevanti da monitorare nel prossimo futuro.
          Se non ci sono elementi sufficientemente rilevanti, restituisci una lista vuota.

          Dopo aver generato il contenuto, scrivi obbligatoriamente il JSON nel file:
          data/summary.json

          Non modificare nessun altro file del repository.
          Verifica che data/summary.json sia un JSON valido prima di terminare.
          PROMPT
          )" --allow-tool=write --allow-tool='shell(cat:*)' --allow-tool='shell(date:*)' --no-ask-user

      - name: Verifica summary.json
        run: python -m json.tool data/summary.json > /dev/null

      - name: Pubblica news, prezzi, storico TTF e sintesi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/branches.json data/market.json data/summary.json data/ttf_history.csv
          git diff --cached --quiet || git commit -m "Aggiorna dati cockpit"
          git push
