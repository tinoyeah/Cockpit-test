name: Aggiorna dati cockpit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Raccoglie le news
        run: python scripts/collect_news.py

      - name: Raccoglie cambi e prezzi
        run: python scripts/collect_market.py

      - name: Genera summary.json con Gemini
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_summary.py

      - name: Pubblica news e sintesi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/market.json data/summary.json
          git diff --cached --quiet || git commit -m "Aggiorna dati cockpit"
          git push
